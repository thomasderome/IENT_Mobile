set_real_ip_from  192.168.1.0/24;
set_real_ip_from  172.16.0.0/12;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

server {
    listen 443 ssl;
    server_name ient-mobile.ddns.net;

    include /config/nginx/ssl.conf;

    # Remove version nginx header
    server_tokens off;

    # For all error nginx return 404 not found
    error_page 400 401 402 403 404 405 500 501 502 503 504 = @empty_error;

    location @empty_error {
        return 404 "";
    }

    # Backend
    location / {
        include /config/nginx/proxy.conf;
        proxy_pass http://ient:3000;
    }
}